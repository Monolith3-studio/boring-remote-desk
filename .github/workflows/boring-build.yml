# Boring Remote Desk app: rebrand, check, build unsigned on Mac and Windows.
# Every job runs boring/rebrand.py on the fresh checkout first; nothing it
# patches is committed. Upstream's own workflows (publish, sign, RustDesk
# infra) are removed from this fork; boring/check.py fails if one comes back.
# Never add the banned codec flags: boring/check.py fails the build if they appear here.
name: Boring Remote build

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boring-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  BRIDGE_RUST_VERSION: "1.75"
  WIN_RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "1.5.0"

jobs:
  rebrand-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Rebrand and pin tests (clean tree, idempotency, moved targets, stale pins)
        run: python3 -m unittest boring/test_rebrand.py boring/test_pins.py -v

      - name: Rebrand this checkout
        run: python3 boring/rebrand.py

      - name: Rebrand check
        run: python3 boring/check.py

      - name: Second run leaves a clean diff
        run: |
          snap() { git status --porcelain; git diff; git -C libs/hbb_common diff; }
          snap > /tmp/first.txt
          python3 boring/rebrand.py | tee /tmp/second-run.txt
          grep -qx "rebrand: 0 changed, 0 moved" /tmp/second-run.txt
          snap > /tmp/second.txt
          diff -u /tmp/first.txt /tmp/second.txt

  bridge:
    needs: rebrand-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Rebrand
        run: python3 boring/rebrand.py

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev \
            llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.BRIDGE_RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: boring-bridge

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Flutter 3.22.3: extended_text 14 needs a newer Dart (same as upstream's bridge job)
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Generate bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-macos:
    needs: bridge
    runs-on: macos-latest # arm64
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Rebrand and check
        run: |
          python3 boring/rebrand.py
          python3 boring/check.py

      - name: Install build runtime
        run: |
          brew install llvm
          command -v pkg-config >/dev/null || brew install pkg-config

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter (same as upstream)
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' packages/flutter/lib/src/scheduler/binding.dart

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: boring-macos

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
            exit 1
          fi

      - name: Build (unsigned)
        run: |
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          ./build.py --flutter --unix-file-copy-paste --screencapturekit

      - name: Smoke test (binary starts)
        run: |
          APP=flutter/build/macos/Build/Products/Release/BoringRemote.app
          test -x "$APP/Contents/MacOS/BoringRemote"
          test -x "$APP/Contents/MacOS/service"
          # ad-hoc seal only, so the bundle runs after build.py copied `service` in; not a release signature
          codesign --force --deep -s - "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist" | grep -qx io.boringlabs.remote.agent
          "$APP/Contents/MacOS/BoringRemote" --version | tee version.txt
          grep -qx "${VERSION}" version.txt
          "$APP/Contents/MacOS/BoringRemote" & pid=$!
          sleep 20
          kill -0 "$pid"   # still running
          kill "$pid"
          ditto -c -k --keepParent "$APP" "BoringRemote-${VERSION}-macos-arm64-unsigned.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boring-remote-macos-arm64-unsigned
          path: BoringRemote-*-macos-arm64-unsigned.zip

  build-windows:
    needs: bridge
    runs-on: windows-latest
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Rebrand and check
        shell: bash
        run: |
          python3 boring/rebrand.py
          python3 boring/check.py

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685 (same build-time engine fix upstream uses)
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter (same as upstream)
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$(dirname "$(dirname "$(which flutter)")")"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.WIN_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: boring-windows

      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
            exit 1
          fi

      - name: Build (unsigned)
        run: python3 .\build.py --portable --flutter --skip-portable-pack

      - name: Smoke test (binary starts)
        run: |
          $dir = ".\flutter\build\windows\x64\runner\Release"
          $exe = "$dir\BoringRemote.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $v = Start-Process $exe -ArgumentList '--version' -Wait -PassThru
          if ($v.ExitCode -ne 0) { throw "--version exited $($v.ExitCode)" }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "BoringRemote.exe exited early with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Compress-Archive -Path "$dir\*" -DestinationPath "BoringRemote-$env:VERSION-windows-x64-unsigned.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boring-remote-windows-x64-unsigned
          path: BoringRemote-*-windows-x64-unsigned.zip

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      # Upstream's WiX v4 project in res/msi, rebranded by boring/rebrand.py (name,
      # art, license, icon, texts). preprocess.py's defaults carry the branding, so
      # it only gets the dist dir. No printer driver and no Amyuni driver are added.
      - name: Build MSI (unsigned)
        run: |
          Copy-Item -Recurse .\flutter\build\windows\x64\runner\Release .\BoringRemote
          pushd .\res\msi
          python preprocess.py -d ..\..\BoringRemote
          if ($LASTEXITCODE -ne 0) { throw "preprocess.py exited $LASTEXITCODE" }
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          if ($LASTEXITCODE -ne 0) { throw "msbuild exited $LASTEXITCODE" }
          $built = Get-ChildItem .\Package\bin\*\Release\en-us\Package.msi | Select-Object -First 1
          popd
          New-Item -ItemType Directory -Force msi-out | Out-Null
          $name = "BoringRemote-$env:VERSION-windows-x64-unsigned.msi"
          Move-Item $built.FullName "msi-out\$name"
          $hash = (Get-FileHash "msi-out\$name" -Algorithm SHA256).Hash.ToLower()
          # LF, not Set-Content's CRLF: the release job checks it with sha256sum -c on Ubuntu
          Set-Content -Path "msi-out\$name.sha256" -Value "$hash  $name`n" -NoNewline -Encoding ascii
          Get-Content "msi-out\$name.sha256"

      # The Engine installs with msiexec /qn, so prove exactly that: silent install,
      # the names people see, the exe and service the app expects, silent uninstall.
      - name: Smoke test MSI (silent install and uninstall)
        run: |
          $msi = (Resolve-Path .\msi-out\*.msi).Path
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v msi-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 80; throw "silent install exited $($p.ExitCode)" }
          $exe = "$env:ProgramFiles\BoringRemote\BoringRemote.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $uninstall = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $arp = Get-ItemProperty $uninstall | Where-Object { $_.DisplayName -eq 'Boring Remote' }
          if (-not $arp) { throw "Apps list has no 'Boring Remote' entry" }
          if ($arp.Publisher -ne 'Boring Labs') { throw "Apps list publisher is '$($arp.Publisher)'" }
          if (Get-ItemProperty $uninstall | Where-Object { $_.DisplayName -like '*RustDesk*' }) { throw "RustDesk in the Apps list" }
          $lnk = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Boring Remote\Boring Remote.lnk"
          if (-not (Test-Path $lnk)) { throw "missing Start menu shortcut $lnk" }
          Get-Service -Name BoringRemote -ErrorAction Stop | Format-List Name, DisplayName, Status
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /l*v msi-uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-uninstall.log -Tail 80; throw "silent uninstall exited $($p.ExitCode)" }
          if (Test-Path $exe) { throw "$exe still there after uninstall" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boring-remote-windows-x64-msi
          path: msi-out/*

  # A tag publishes the unsigned MSI and its checksum on that tag's GitHub release
  # (created here if it isn't there yet, so the Mac job can add to the same one).
  release-windows:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boring-remote-windows-x64-msi
          path: msi-out

      - name: Publish MSI and sha256 to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd msi-out
          sha256sum -c ./*.msi.sha256
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Boring Remote $TAG" \
              --notes "Unsigned build. On Windows, SmartScreen will warn: choose More info, then Run anyway. Check the download against its .sha256 file." \
              || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*.msi ./*.msi.sha256
